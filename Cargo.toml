[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/testkit"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
stack-core = { path = "crates/core" }
stack-testkit = { path = "crates/testkit" }

gix = "0.87"
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
